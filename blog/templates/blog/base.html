{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Blog{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal flex flex-col min-h-screen">


    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <span class="text-2xl font-bold tracking-tight">
                <a href="{% url 'blog:post_list' %}" class="hover:text-blue-200 transition duration-300">Meu Blog</a>
            </span>
            
        </div>
    </header>


    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <div id="content" class="w-full">
            {% block content %}

            {% endblock %}
        </div>
    </main>


    <footer class="bg-gray-800 text-gray-300 py-6 mt-8">
        <div class="container mx-auto text-center text-sm">
            &copy; 2025 José Amauri.
        </div>
    </footer>

</body>

</html>
